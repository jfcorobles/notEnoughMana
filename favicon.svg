<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a1e"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <path d="M190 120 C 120 120, 80 180, 80 240 C 80 320, 190 390, 240 420 C 240 370, 240 280, 240 200 C 240 150, 220 120, 190 120 Z" fill="url(#heartGrad)" filter="url(#glow)"/>
  <path d="M322 120 C 352 120, 372 150, 372 200 C 372 280, 372 370, 272 420 C 322 390, 432 320, 432 240 C 432 180, 392 120, 322 120 Z" fill="url(#dropGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
</svg>
